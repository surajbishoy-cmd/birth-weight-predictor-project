
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Baby Birth Weight Prediction</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* MAIN BACKGROUND */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;

            background:
                radial-gradient(circle at 15% 20%, #8e44ad 0%, transparent 35%),
                radial-gradient(circle at 85% 80%, #3498db 0%, transparent 35%),
                linear-gradient(135deg, #141e30, #243b55);

            background-attachment: fixed;
        }

        /* MAIN CONTAINER */
        .container {
            width: 100%;
            max-width: 550px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 22px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);

            animation: fadeIn 1s ease;
        }

        /* ANIMATION */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* HEADING */
        h1 {
            color: white;
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #d6e4f0;
            text-align: center;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* LABELS */
        label {
            display: block;
            color: white;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        /* INPUT FIELDS */
        input {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 20px;

            background: rgba(255, 255, 255, 0.9);
            border: 2px solid transparent;
            border-radius: 10px;

            font-size: 15px;
            outline: none;

            transition: all 0.3s ease;
        }

        /* INPUT FOCUS EFFECT */
        input:focus {
            border-color: #74b9ff;
            box-shadow: 0 0 12px rgba(116, 185, 255, 0.7);
            transform: scale(1.02);
        }

        /* BUTTON */
        button {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(135deg, #8e44ad, #3498db);

            color: white;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        /* RESULT BOX */
        .result {
            margin-top: 25px;
            padding: 18px;

            text-align: center;
            color: white;

            background: rgba(46, 204, 113, 0.2);
            border: 1px solid rgba(46, 204, 113, 0.5);
            border-radius: 12px;
        }

        .result h3 {
            margin-bottom: 8px;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            color: #bdc3c7;
            font-size: 12px;
            margin-top: 25px;
        }

        /* MOBILE RESPONSIVENESS */
        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 23px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Baby Birth Weight Prediction</h1>

        <p class="subtitle">
            AI-powered birth weight estimation system
        </p>

        <form action="/predict" method="POST">

            <label>Gestation (weeks)</label>
            <input name="gestation" type="number" step="any" required>

            <label>Parity</label>
            <input name="parity" type="number" step="1" required>

            <label>Mother's Age (years)</label>
            <input name="age" type="number" step="any" required>

            <label>Mother's Height</label>
            <input name="height" type="number" step="any" required>

            <label>Mother's Weight</label>
            <input name="weight" type="number" step="any" required>

            <label>Smoking Status (0 = No, 1 = Yes)</label>
            <input name="smoke" type="number" min="0" max="1" step="1" required>

            <button type="submit">
                Predict Birth Weight
            </button>

        </form>

        {% if prediction is not none %}
        <div class="result">
            <h3>Prediction Result</h3>
            <h2>{{ prediction }}</h2>
            <p>Estimated birth weight in the dataset's measurement unit</p>
        </div>
        {% endif %}

        <div class="footer">
            Machine Learning Based Prediction Project
        </div>

    </div>

</body>
</html>
